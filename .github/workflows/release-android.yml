name: Release KeyStack 0.2.0 — Android

on:
  push:
    branches:
      - release/0.2.0-android

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore release signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: keystack-keystore-v1

      - name: Generate signing key if needed
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias keystack \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=KeyStack, OU=KeyStack, O=KeyStack, C=RU"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build universal release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify APK output
        shell: bash
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Publish Android asset to KeyStack 0.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: main
          name: KeyStack 0.2.0
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## KeyStack 0.2.0
            
            Большое обновление приложения после версии 0.1.0. В релиз входят Android и Windows x64.
            
            ### Что нового
            
            - **Обновлённый интерфейс в стиле Mistral Vibe:** переработаны рабочая область чата, боковая панель, список диалогов, приветственный экран и элементы ввода.
            - **Настройка внешнего вида:** акцентный цвет теперь применяется последовательно по всему интерфейсу; добавлены настройки размера текста, ширины сообщений и анимаций.
            - **Управление переписками:** переименование, закрепление и удаление чатов; редактирование сообщений и создание отдельных веток от ответов нейросети.
            - **Поиск в интернете:** встроенный поиск без отдельного API-ключа. KeyStack может находить веб-результаты по запросу и передавать их в контекст нейросети.
            - **Вложения:** отправка изображений и файлов, в том числе сообщений только с файлами. В Windows добавлены перетаскивание файлов в окно, вставка изображений из буфера обмена и история недавних вложений.
            - **Информация о модели:** отображение реального размера контекстного окна и приблизительного расхода токенов.
            - **Состояние API и лимиты:** отображение статуса подключения и доступной квоты провайдера, более понятные ошибки и автоматический переход к другому настроенному провайдеру при сбое.
            - **Надёжность генерации:** отображение прогресса и расхода токенов во время ответа, ограничения по времени ожидания и возможность восстановить незавершённый запрос.
            - **Рабочая папка в Windows:** нейросеть может анализировать текстовые файлы выбранной папки и по явной просьбе создавать или изменять файлы внутри неё с ограничением доступа к рабочему каталогу.
            - **Фирменный стиль KeyStack:** обновлены логотип и значок приложения, улучшено применение системной темы и акцентных цветов.
            - **Уведомления об обновлениях:** приложение проверяет GitHub Releases и сообщает о выходе новой версии с кнопками «Позже» и «Обновить».
            
            ### Загрузки
            
            - **Android:** универсальный APK — `app-release.apk`.
            - **Windows x64:** установщик MSI — `KeyStack-0.2.0.msi`.
            
            ### Установка
            
            **Android:** скачайте APK на телефон, откройте его и подтвердите установку. При необходимости разрешите установку приложений из используемого источника.
            
            **Windows:** скачайте MSI и запустите установщик. Установщик обновляет приложение с сохранением идентификатора продукта.
            
            Для работы с нейросетями потребуется собственный API-ключ выбранного провайдера. Условия доступа и оплаты определяет провайдер.
            
          files: app/build/outputs/apk/release/app-release.apk
