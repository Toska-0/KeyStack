name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Save log to branch
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          touch build.log
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main || true
          git checkout -B build-logs origin/main || git checkout --orphan build-logs
          cp build.log build-error.log
          git add build-error.log
          git commit -m "build log (run ${{ github.run_number }})" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-logs --force || true

      - name: Report error as issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            grep -n -i -E -B 2 -A 8 "error:|e: |FAILURE|Exception|Caused by" build.log | tail -150
            echo '```'
          } > issue_body.md || true
          gh issue create --title "Build failed (run ${{ github.run_number }})" --body-file issue_body.md || true

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KeyStack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
