name: Release KeyStack 0.1.0 — All platforms

on:
  push:
    branches:
      - release/0.1.0-windows

permissions:
  contents: write

concurrency:
  group: keystack-release-v0.1.0
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Windows x64 MSI
        run: gradle :desktop:packageDistributionForCurrentOS --no-daemon

      - name: Verify MSI output
        shell: pwsh
        run: |
          $msi = Get-ChildItem "desktop/build/compose/binaries/main/msi/*.msi"
          if (-not $msi) { throw "MSI installer was not produced." }
          Get-Item $msi.FullName | Format-List Name,Length,FullName

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: pc-version
          name: KeyStack 0.1.0
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## KeyStack 0.1.0
            
            Первая публичная версия KeyStack. В этом релизе собраны обе платформы.
            
            ### Загрузки
            - **Android:** универсальный APK для Android-смартфонов — `app-release.apk`.
            - **Windows x64:** установщик MSI для 64-разрядной Windows — `KeyStack-0.1.0.msi`.
            
            ### Установка
            **Android:** скачайте APK на телефон, откройте его и подтвердите установку. При необходимости разрешите установку приложений из используемого источника.
            
            **Windows:** скачайте MSI и запустите установщик.
            
            Для работы с нейросетями потребуется собственный API-ключ выбранного провайдера. Условия доступа и оплаты определяет провайдер.
          files: desktop/build/compose/binaries/main/msi/*.msi
