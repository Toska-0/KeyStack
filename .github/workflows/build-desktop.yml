name: Build Windows Desktop

on:
  push:
    branches: [ pc-version ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build portable distributable
        run: gradle :desktop:createDistributable --no-daemon

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path 'desktop/build/compose/binaries/main/app/KeyStack/*' -DestinationPath 'KeyStack-windows-portable.zip' -Force

      - name: Package MSI installer
        run: gradle :desktop:packageDistributionForCurrentOS --no-daemon

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: KeyStack-windows-portable
          path: KeyStack-windows-portable.zip

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: KeyStack-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KeyStack-windows-portable.zip
            desktop/build/compose/binaries/main/msi/*.msi
